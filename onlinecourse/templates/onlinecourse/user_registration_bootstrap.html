<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>
{% include 'onlinecourse/navbar.html' %}
<div class="container mt-4">
    <form action="{% url 'onlinecourse:registration' %}" method="post">
        {% csrf_token %}
        <h1>Sign Up</h1>
        {% if message %}<div class="alert alert-warning">{{ message }}</div>{% endif %}
        <div class="form-group">
            <label for="username"><b>User Name</b></label>
            <input id="username" type="text" class="form-control" placeholder="Enter User Name" name="username" required>
            <label for="firstname"><b>First Name</b></label>
            <input id="firstname" type="text" class="form-control" placeholder="Enter First Name" name="firstname" required>
            <label for="lastname"><b>Last Name</b></label>
            <input id="lastname" type="text" class="form-control" placeholder="Enter Last Name" name="lastname" required>
            <label for="psw"><b>Password</b></label>
            <input id="psw" type="password" class="form-control" placeholder="Enter Password" name="psw" required>
            <button class="btn btn-primary mt-2" type="submit">Sign up</button>
        </div>
    </form>
</div>
</body>
</html>
